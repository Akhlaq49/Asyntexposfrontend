    <style>
      /* Number boxes (prices, amounts, quantities): no up/down arrows - values are typed */
      input[type=number]::-webkit-outer-spin-button,
      input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; appearance: textfield; }
      /* Native scrollbar for sidebar (replaces jQuery SlimScroll) */
      .sidebar .sidebar-inner.slimscroll {
        overflow-y: auto !important;
        overflow-x: hidden !important;
        height: calc(100vh - 60px) !important;
      }
      .sidebar .sidebar-inner.slimscroll::-webkit-scrollbar {
        width: 7px;
      }
      .sidebar .sidebar-inner.slimscroll::-webkit-scrollbar-thumb {
        background-color: #ccc;
        border-radius: 4px;
      }
      .sidebar .sidebar-inner.slimscroll::-webkit-scrollbar-track {
        background: transparent;
      }

      /* Keep custom PNG logo aligned with the original Asyntex logo footprint */
      .login-logo img {
        width: 200px;
        height: 56px;
        object-fit: contain;
        object-position: center top;
        display: inline-block;
      }
    </style>
